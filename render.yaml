services:
  - type: web
    name: jarvis-software-agent
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server.mjs
    autoDeploy: false
    healthCheckPath: /api/status
    envVars:
      - key: JARVIS_HOST
        value: 0.0.0.0
      - key: JARVIS_ACCESS_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FISH_AUDIO_API_KEY
        sync: false
      - key: FISH_AUDIO_MODEL_ID
        sync: false
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: POLLINATIONS_IMAGE_MODEL
        value: black-forest-labs/flux.1-schnell
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: 9375G6zswFk7v9bKTVQF
      - key: ELEVENLABS_MODEL_ID
        value: eleven_flash_v2_5
